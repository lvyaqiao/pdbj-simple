schema:
  schema_id: pdbj
  name: 拼读并击-简单版
  version: 20241113
  author:
    - 张皓哲（576440085@qq.com）
    - 吕亚乔(1051107570@qq.com)
  description:
  dependencies:
    - stroke
switches:
  - name: zh_simp_s2t
    reset: 0
    states: [ 简, 繁 ]
  - name: ascii_punct
    reset: 0
    states: [ 。，, ．， ]
  - name: full_shape
    reset: 0
    states: [ 半, 全 ]
  - name: ascii_mode
    reset: 0
    states: [ 中, 英 ]
engine:
  processors:
    - ascii_composer
    - recognizer
    - chord_composer
    - lua_processor@*pdbj.topup_processor #上屏处理器，实现顶屏/清屏规则
    - speller
    - key_binder
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - lua_translator@*pdbj.time
    - lua_translator@*pdbj.jisuanqi
    - punct_translator
    - table_translator
  filters:
    - lua_filter@*pdbj.preedit_filter
    - reverse_lookup_filter@reverse_lookup
    - lua_filter@*pdbj.assembly
    - simplifier
    - uniquifier
    - lua_filter@*pdbj.clear_filter

simplifier:
  option_name: zh_simp_s2t
  opencc_config: s2t.json
speller:
  auto_select: true
  # 自动选择模式：与 lua/pdbj/common.lua 的 SPELLER_AUTO_SELECT_PATTERN 同步
  # 修改顶屏规则时请同时更新 common.lua
  auto_select_pattern: '^(.Z.|Z..|..a|....+)$'
  alphabet: 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ'
  algebra:
chord_composer:
  finish_chord_on_first_key_release: true
  alphabet: 'qazwsxedcrfvtgbp;/ol.ik,ujmyhn '
  algebra:
    - xlit| ;,./|ABCDE|
    - xform/^([qazwsxedcrfvtgb]*)([pBEolDikCujmyhn]*)([A]*)$/<$1><$2><$3>/
    - xform/<>/Z/

    # === 初始转换：符号映射 -> 和弦分组 -> 空缺占位 ===
    - xform/<A>/a/

    # === 声介+韵调 编码 小写区 (a-z) ===
    # d #4
    - xform/<f>/a/
    - xform/<u>/a/
    # y e1
    - xform/<df>/b/
    - xform/<B>/b/
    # sh #3
    - xform/<xc>/c/
    - xform/<a>/c/
    - xform/<i>/c/
    # ji #1
    - xform/<qw>/d/
    - xform/<w>/d/
    - xform/<p>/d/
    # zh e4
    - xform/<we>/e/
    - xform/<e>/e/
    - xform/<j>/e/
    # xi #2
    - xform/<zx>/f/
    - xform/<t>/f/
    - xform/<o>/f/
    # w eng1
    - xform/<cv>/g/
    - xform/<xv>/g/
    - xform/<Bj>/g/
    # b bu an4
    - xform/<s>/h/
    - xform/<st>/h/
    - xform/<Cm>/h/
    # z e2不
    - xform/<rt>/i/
    - xform/<zf>/i/
    - xform/<l>/i/

    # f fu eng2
    - xform/<c>/j/
    - xform/<ac>/j/
    - xform/<lh>/j/
    - xform/<kh>/j/ 
    # gu e3
    - xform/<qr>/k/
    - xform/<k>/k/
    # m mu en1
    - xform/<d>/l/
    - xform/<qd>/l/
    - xform/<Bh>/l/
    # li ei4
    - xform/<fb>/m/
    - xform/<ae>/m/
    - xform/<ij>/m/
    # h an2
    - xform/<zb>/n/
    - xform/<z>/n/
    - xform/<mn>/n/
    - xform/<ED>/n/
    # l a1
    - xform/<b>/o/
    - xform/<ar>/o/
    - xform/<E>/o/
    # qi eng4
    - xform/<as>/p/
    - xform/<lj>/p/
    # yu ao4
    - xform/<sf>/q/
    - xform/<lm>/q/
    # g en2
    - xform/<qt>/r/
    - xform/<q>/r/
    - xform/<jh>/r/
    - xform/<Bl>/r/
    # t ai4
    - xform/<v>/s/
    - xform/<km>/s/
    # hu an1
    - xform/<zv>/t/
    - xform/<En>/t/
    # zhu a4
    - xform/<qe>/u/
    - xform/<m>/u/
    # r ang4
    - xform/<er>/v/
    - xform/<Dm>/v/
    # ch ou3
    - xform/<sd>/w/
    - xform/<pk>/w/
    - xform/<h>/w/
    # du an3
    - xform/<wf>/x/
    - xform/<DC>/x/
    # di ang1
    - xform/<ef>/y/
    - xform/<Em>/y/
    # k ou4
    - xform/<ag>/z/
    - xform/<oj>/z/

    # === 声介+韵调 编码 大写区 (A-Y) ===
    # # ao3
    - xform/<r>/A/
    - xform/<BC>/A/
    - xform/<n>/A/
    # n en4
    - xform/<g>/B/
    - xform/<kj>/B/
    # bi ai2
    - xform/<qs>/C/
    - xform/<qf>/C/
    - xform/<jn>/C/
    - xform/<BD>/C/
    # shu eng3
    - xform/<zc>/D/
    - xform/<Bk>/D/
    # zu ang2
    - xform/<et>/E/
    - xform/<zd>/E/
    - xform/<Cn>/E/
    - xform/<Dn>/E/
    # ti ang3
    - xform/<dv>/F/
    - xform/<EC>/F/
    # mi en3
    - xform/<wd>/G/
    - xform/<lk>/G/
    # chu a3
    - xform/<ad>/H/
    - xform/<C>/H/
    # qu ou2
    - xform/<sg>/I/
    - xform/<ih>/I/
    - xform/<ly>/I/
    # s ei2
    - xform/<vb>/J/
    - xform/<sr>/J/
    - xform/<pl>/J/
    - xform/<uh>/J/
    # ni ei3
    - xform/<rg>/K/
    - xform/<ok>/K/
    # c ao1
    - xform/<fg>/L/
    - xform/<ec>/L/
    - xform/<dc>/L/
    - xform/<Ej>/L/
    - xform/<Bm>/L/
    # tu ou1
    - xform/<sv>/M/
    - xform/<Bu>/M/
    - xform/<pj>/M/
    # xu ei1
    - xform/<xb>/N/
    - xform/<xf>/N/
    - xform/<By>/N/
    - xform/<ph>/N/
    # ju a2
    - xform/<wt>/O/
    - xform/<D>/O/
    # su ao2
    - xform/<cb>/P/
    - xform/<se>/P/
    - xform/<kn>/P/
    - xform/<Dh>/P/
    # p pu ai3
    - xform/<x>/Q/
    - xform/<xg>/Q/
    - xform/<lC>/Q/
    # lu ai1
    - xform/<db>/R/
    - xform/<aw>/R/
    - xform/<Eh>/R/
    - xform/<Bn>/R/

    # === 一击字（仅声介，无韵调）=== ru ku pi cu lv nu nv小
    # ru
    - xform/<wr>/S/
    - xform/<iu>/S/
    # ku
    - xform/<af>/T/
    - xform/<oi>/T/
    # pi
    - xform/<ax>/U/
    - xform/<av>/U/
    - xform/<po>/U/
    # cu 
    - xform/<dg>/V/
    - xform/<sc>/V/
    - xform/<pi>/V/
    # lv
    - xform/<sb>/W/
    - xform/<ou>/W/
    # nu
    - xform/<eg>/X/
    - xform/<pu>/X/
    # nv小
    - xform/<wg>/Y/
    - xform/<y>/Y/
    # === 清理和还原规则 ===
    - xform/[<>]//
    - xform/^(..[Za])$/#$1/
    - xform/^[^#].*//
    - xform/#//
    - xform/ZZa/ /
    - xform/ZBZ/;/
    - xform/ZpZ/,/
    - xform/ZgZ/./
    - xform ZGZ / 
  prompt_format:
    - xform/.*//
translator:
  dictionary: pdbj
  enable_charset_filter: false
  enable_completion: true
  enable_sentence: false
  enable_user_dict: true
  enable_encoder: true
  encode_commit_history: true
  max_phrase_length: 7
  #一击和第二击单手不调频
  disable_user_dict_for_patterns:
    - '^(...|....Z.|...Z..)$'
  # preedit_format 已迁移至 lua_filter@*pdbj.preedit_filter
  # 映射数据: lua/pdbj/preedit_map.lua
  comment_format:
    - xform/~.*//
punctuator:
  import_preset: symbols_pdbj
menu:
  page_size: 5
  alternative_select_keys: "_;,./"
  alternative_select_labels: [1, 2, 3, 4, 5]
key_binder:
  bindings:
    #退格即清屏
    - { accept: BackSpace, send: Escape, when: composing }
    #一次退一击
    - { accept: BackSpace, send_sequence: "{BackSpace}{BackSpace}{BackSpace}", when: composing }
    - { accept: bracketleft, send: Page_Up, when: has_menu }
    - { accept: minus, send: Page_Up, when: has_menu}
    - { accept: bracketright, send: Page_Down, when: has_menu }
    - { accept: equal, send: Page_Down, when: has_menu }
    - { when: composing, accept: "Control+p", send: Up }     # ↑
    - { when: composing, accept: "Control+n", send: Down }   # ↓

recognizer:
  patterns:
    punct: '^\\([0-9]0?|[A-Za-z]+)?$'
    expression: "^=.*$"


reverse_lookup:
  overwrite_comment: true
  comment_format:
    - "xform/~//"
  tags: [extra]

